<script>
let lang='zh';

// ========== 五行部首库 ==========
const ELEM={
  '金':{en:'Metal',chars:'金银铜铁锡钊钦铉铭锐锋',desc:'坚毅果断，重承诺，有原则',enDesc:'Firm, decisive, principled'},
  '木':{en:'Wood',chars:'林森树松柏杨柳桂桃李梅杏',desc:'向上生长，温和包容，有生机',enDesc:'Growing, gentle, full of life'},
  '水':{en:'Water',chars:'江河湖海洋泉溪流波涛汉沈',desc:'灵活变通，智慧深邃，善适应',enDesc:'Flexible, wise, adaptable'},
  '火':{en:'Fire',chars:'炎焰灯灿烂煌炳炬烽燮',desc:'热情奔放，行动力强，有感染力',enDesc:'Passionate, energetic, contagious'},
  '土':{en:'Earth',chars:'地坤城垣基培境址坚',desc:'稳重踏实，可靠可信，能承载',enDesc:'Steady, reliable, grounded'}
};

// ========== 部首五行映射（覆盖200+部首，让所有常用字准确判五行） ==========
const RADICAL_ELEM={
  // 金（0）
  '钅':0,'金':0,'刂':0,'刀':0,'戈':0,'刃':0,'剑':0,'矛':0,'矢':0,'斤':0,'辛':0,'酉':0,'庚':0,'申':0,'兑':0,'肃':0,
  // 木（1）
  '木':1,'林':1,'艹':1,'禾':1,'竹':1,'⺮':1,'森':1,'杉':1,'柳':1,'杨':1,'桂':1,'柏':1,'松':1,'梅':1,'杏':1,'草':1,'艸':1,'乙':1,'寅':1,'卯':1,'东':1,'青':1,'生':1,
  // 水（2）
  '氵':2,'水':2,'冫':2,'雨':2,'川':2,'冰':2,'雪':2,'霜':2,'露':2,'云':2,'泉':2,'江':2,'河':2,'湖':2,'海':2,'波':2,'浪':2,'流':2,'泪':2,'汁':2,'亥':2,'子':2,'北':2,'黑':2,'鱼':2,
  // 火（3）
  '火':3,'灬':3,'日':3,'光':3,'炎':3,'焰':3,'灯':3,'灿':3,'烂':3,'煌':3,'炬':3,'炳':3,'烽':3,'热':3,'煮':3,'烈':3,'照':3,'然':3,'焦':3,'红':3,'赤':3,'丹':3,'丙':3,'丁':3,'巳':3,'午':3,'南':3,
  // 土（4）
  '土':4,'山':4,'石':4,'田':4,'王':4,'玉':4,'地':4,'坤':4,'城':4,'垣':4,'基':4,'培':4,'境':4,'址':4,'坚':4,'坤':4,'尘':4,'泥':4,'堆':4,'堤':4,'壁':4,'崖':4,'岩':4,'砂':4,'砖':4,'戊':4,'己':4,'丑':4,'辰':4,'未':4,'戌':4,'中':4
};

// ========== 常见汉字测字库 ==========
const CEZI={
  '安':{elem:4,radical:'宀',structure:'上下结构（宀+女）',zh:'宝盖头是家，女是家人。家中有女，安宁祥和。测"安"字，主安稳顺遂，家庭和睦，宜守成不宜冒进。',en:'The roof (宀) is home, the woman (女) is family. A woman in the home brings peace. "An" (peace) signals stability and harmony—better to consolidate than to venture.',tip:'求稳则吉，家和万事兴',enTip:'Seek stability; harmony prospers'},
  '福':{elem:4,radical:'礻',structure:'左右结构（礻+畐）',zh:'示字旁是祭祀，畐是满腹。福是上天赐予的丰足。测"福"字，主福气临门，所求之事多有善果。',en:'The altar (礻) plus abundance (畐). Fortune is heaven-granted fullness. "Fu" (fortune) signals blessings approaching—your pursuit will bear good fruit.',tip:'福气临门，善果将至',enTip:'Fortune approaches; good fruit awaits'},
  '缘':{elem:1,radical:'纟',structure:'左右结构（纟+彖）',zh:'丝旁是缠绕，彖是缘由。缘分如丝，可遇不可求。测"缘"字，主缘分将至，感情或人际有新机。',en:'The silk (纟) winds, the base speaks of cause. Fate is like silk—it comes when it comes. "Yuan" (fate) signals new bonds in love or friendship.',tip:'缘分将至，静待佳音',enTip:'Fate approaches; await good news'},
  '路':{elem:2,radical:'足',structure:'左右结构（足+各）',zh:'足是行走，各是各人。路在脚下，各人各走。测"路"字，主前程在自己脚下，宜主动开拓。',en:'The foot (足) walks, each (各) goes their way. The road is under your feet. "Lu" (road) signals your future is yours to forge—take initiative.',tip:'路在脚下，主动开拓',enTip:'The road is yours; take initiative'},
  '财':{elem:0,radical:'贝',structure:'左右结构（贝+才）',zh:'贝是钱币，才是才能。以才生财，财才相生。测"财"字，主财靠才能，有才自有财。',en:'The shell (贝) is money, the talent (才) is ability. Wealth grows from talent. "Cai" (wealth) signals money follows ability.',tip:'以才生财，有才自有财',enTip:'Wealth follows talent'},
  '梦':{elem:1,radical:'木',structure:'上下结构（林+夕）',zh:'双木是林，夕是夜。梦在夜里生，虚幻难捉。测"梦"字，主理想需落地，空想无益。',en:'Twin trees (林) and night (夕). Dreams are born at night, elusive. "Meng" (dream) signals ideals must be grounded—idle fancy helps nothing.',tip:'理想需落地，空想无益',enTip:'Ground your dreams; idle fancy helps nothing'},
  '静':{elem:2,radical:'青',structure:'左右结构（青+争）',zh:'青是纯净，争是纷扰。静是于纷扰中守住纯净。测"静"字，主宜静不宜动，以静制动。',en:'Purity (青) meets strife (争). Stillness is keeping pure amid chaos. "Jing" (stillness) signals stillness over motion—win by patience.',tip:'以静制动，守住本心',enTip:'Win by stillness; keep your heart'},
  '思':{elem:4,radical:'田',structure:'上下结构（田+心）',zh:'田上是心。思是心在耕耘。测"思"字，主多思多虑，宜果断，想太多反误事。',en:'The heart above the field. Thought is the heart tilling. "Si" (think) signals overthinking—be decisive, too much thought backfires.',tip:'想太多误事，宜果断',enTip:'Overthinking backfires; be decisive'},
  '勇':{elem:3,radical:'力',structure:'上下结构（甬+力）',zh:'甬上有力。勇是心中有力量。测"勇"字，主敢作敢为，勇往直前必有成。',en:'Strength over the base. Courage is power in the heart. "Yong" (courage) signals bold action—advance and you will succeed.',tip:'勇往直前，敢作敢为',enTip:'Advance boldly; act with courage'},
  '富':{elem:4,radical:'宀',structure:'上下结构（宀+畐）',zh:'宝盖是家，畐是满。家有满仓即富。测"富"字，主财富渐丰，宜守财理财。',en:'The roof (宀) and fullness (畐). A full house is wealth. "Fu" (wealth) signals growing fortune—manage it well.',tip:'财富渐丰，宜守财',enTip:'Fortune grows; manage it well'},
  '乐':{elem:1,radical:'丿',structure:'独体字',zh:'乐字本是乐器，引申为快乐。测"乐"字，主心境开朗，快乐自寻。',en:'"Le" originally a musical instrument, extended to joy. It signals an open heart—joy is self-found.',tip:'快乐自寻，心境开朗',enTip:'Joy is self-found; open your heart'},
  '和':{elem:1,radical:'口',structure:'左右结构（禾+口）',zh:'禾是庄稼，口是言语。有粮有言，和也。测"和"字，主人际和谐，家和万事兴。',en:'Grain (禾) and speech (口). With food and words comes harmony. "He" signals harmonious relations—a harmonious family prospers.',tip:'人际和谐，家和万事兴',enTip:'Harmony in relations; family prospers'},
  '成':{elem:0,radical:'戈',structure:'独体字',zh:'成字含戈，成事需拼。测"成"字，主事在人为，坚持终成。',en:'"Cheng" contains a spear—achievement needs struggle. It signals success through persistence.',tip:'事在人为，坚持终成',enTip:'Success through persistence'},
  '望':{elem:2,radical:'月',structure:'上下结构（亡+月+王）',zh:'望是眺望远方。测"望"字，主有盼头，目标在前，坚持可及。',en:'"Wang" means gazing afar. It signals hope ahead—your goal is reachable with persistence.',tip:'有盼头，目标在前',enTip:'Hope ahead; the goal is reachable'},
  '平':{elem:4,radical:'干',structure:'独体字',zh:'平是平坦均等。测"平"字，主平稳安康，无大起大落。',en:'"Ping" means level and equal. It signals a calm, steady path without great upheavals.',tip:'平稳安康，无大起大落',enTip:'Calm and steady; no great upheavals'},
  '顺':{elem:2,radical:'川',structure:'左右结构（川+页）',zh:'川是流水，顺是顺势。测"顺"字，主顺势而为，诸事顺遂。',en:'The river (川) flows; "Shun" means going with the flow. It signals smooth sailing by following the current.',tip:'顺势而为，诸事顺遂',enTip:'Go with the flow; all goes smoothly'},
  '好':{elem:2,radical:'女',structure:'左右结构（女+子）',zh:'女和子，美好。测"好"字，主好事将近，感情事业双丰收。',en:'Woman and child—goodness. "Hao" signals good things approaching, in both love and career.',tip:'好事将近，双丰收',enTip:'Good things approach; double harvest'},
  '康':{elem:4,radical:'广',structure:'半包围结构（广+隶）',zh:'广是宽广，隶是隶属。康是身心安康。测"康"字，主健康安泰，身心舒畅。',en:'"Kang" signals health and well-being—body and mind at ease.',tip:'健康安泰，身心舒畅',enTip:'Health and ease of body and mind'},
  '鑫':{elem:0,radical:'金',structure:'品字结构（三金）',zh:'三金相叠，财源滚滚。测"鑫"字，主财运亨通，富贵盈门。',en:'Three golds stacked—wealth flowing. "Xin" signals flourishing fortune and prosperity.',tip:'财运亨通，富贵盈门',enTip:'Fortune flourishes; prosperity arrives'},
  '龙':{elem:2,radical:'龙',structure:'独体字',zh:'龙是祥瑞神物。测"龙"字，主大有可为，飞龙在天。',en:'The dragon is an auspicious deity. "Long" signals great potential—the flying dragon in heaven.',tip:'大有可为，飞龙在天',enTip:'Great potential; the dragon flies'},

  '爱':{elem:4,radical:'心',structure:'上下结构（爫+冖+友）',zh:'爱字有心，心在友上。爱是心与友的交融。测"爱"字，主感情深厚，宜真诚付出。',en:'Love has a heart over friendship. "Ai" signals deep affection—give sincerely.',tip:'真诚付出，爱有回响',enTip:'Give sincerely; love echoes'},
  '信':{elem:0,radical:'亻',structure:'左右结构（亻+言）',zh:'人言为信。说话算数就是信。测"信"字，主诚信立身，诺言千金。',en:'A person\u2019s word is trust. "Xin" signals integrity—your word is your bond.',tip:'诚信立身，诺言千金',enTip:'Integrity builds; your word is gold'},
  '义':{elem:0,radical:'丶',structure:'独体字',zh:'义是合宜正当。测"义"字，主行事合乎道义，坦荡无愧。',en:'"Yi" means what is right. It signals righteous conduct and a clear conscience.',tip:'行事合义，坦荡无愧',enTip:'Act righteously; a clear conscience'},
  '德':{elem:4,radical:'彳',structure:'左右结构（彳+十+四+心）',zh:'德字含心，德行在心。测"德"字，主以德服人，厚德载物。',en:'"De" contains a heart—virtue lives within. It signals winning through virtue.',tip:'厚德载物，以德服人',enTip:'Great virtue carries all; win through character'},
  '善':{elem:3,radical:'口',structure:'上下结构（羊+口）',zh:'羊是温顺，口是言语。善是温言善行。测"善"字，主善有善报，积善成德。',en:'The gentle sheep and the mouth. "Shan" signals kindness—good deeds bring good returns.',tip:'善有善报，积善成德',enTip:'Kindness returns; accumulate good'},
  '美':{elem:4,radical:'羊',structure:'上下结构（羊+大）',zh:'羊大则美。美是丰盛美好。测"美"字，主审美提升，生活丰美。',en:'A big sheep is beautiful. "Mei" signals beauty and abundance.',tip:'生活丰美，审美提升',enTip:'Abundant beauty; refined taste'},
  '喜':{elem:3,radical:'口',structure:'上下结构（壴+口）',zh:'喜是鼓乐之喜。测"喜"字，主喜事临门，心情愉悦。',en:'"Xi" is the joy of drum and song. It signals happy events approaching.',tip:'喜事临门，心情愉悦',enTip:'Joy approaches; a glad heart'},
  '幸':{elem:4,radical:'土',structure:'上下结构（土+羊）',zh:'幸是幸运幸福。测"幸"字，主幸运眷顾，否极泰来。',en:'"Xing" means fortune and bliss. It signals luck smiling on you.',tip:'幸运眷顾，否极泰来',enTip:'Luck smiles; the worst is over'},
  '诚':{elem:0,radical:'讠',structure:'左右结构（讠+成）',zh:'言成则诚。说到做到是诚。测"诚"字，主诚心诚意，金石为开。',en:'Words fulfilled are sincerity. "Cheng" signals that honesty opens all doors.',tip:'诚心诚意，金石为开',enTip:'Sincerity opens even stone'},
  '智':{elem:3,radical:'日',structure:'上下结构（知+日）',zh:'知日为智，日积月累的知。测"智"字，主智慧渐长，明辨是非。',en:'Knowledge accumulated daily becomes wisdom. "Zhi" signals growing insight.',tip:'智慧渐长，明辨是非',enTip:'Wisdom grows; discern clearly'},
  '慧':{elem:3,radical:'心',structure:'上下结构（彗+心）',zh:'慧字有心，聪慧在心。测"慧"字，主心思清明，慧眼识珠。',en:'"Hui" has a heart—wisdom lives within. It signals clear discernment.',tip:'心思清明，慧眼识珠',enTip:'Clear mind; discerning eye'},
  '友':{elem:4,radical:'又',structure:'独体字',zh:'友是志同道合。测"友"字，主良友相伴，情谊长存。',en:'"You" is like-minded companionship. It signals true friends staying.',tip:'良友相伴，情谊长存',enTip:'True friends stay; bonds endure'},
  '情':{elem:2,radical:'忄',structure:'左右结构（忄+青）',zh:'心旁是情，青是纯净。情是纯净的心。测"情"字，主感情纯真，宜真心相待。',en:'The heart radical and purity. "Qing" signals sincere feeling—treat it truly.',tip:'感情纯真，真心相待',enTip:'Sincere feeling; treat it truly'},
  '婚':{elem:3,radical:'女',structure:'左右结构（女+昏）',zh:'女旁是婚姻，昏是黄昏成礼。测"婚"字，主姻缘可期，良缘将至。',en:'"Hun" carries the bride radical—marriage at dusk. It signals a good match approaching.',tip:'姻缘可期，良缘将至',enTip:'A good match approaches'},
  '运':{elem:2,radical:'辶',structure:'半包围结构（云+辶）',zh:'云是变幻，辶是行走。运是流动变化。测"运"字，主运势流转，时来运转。',en:'Clouds and walking—fortune flows and changes. "Yun" signals a turn of luck.',tip:'运势流转，时来运转',enTip:'Fortune turns; luck shifts'},
  '势':{elem:3,radical:'力',structure:'上下结构（埶+力）',zh:'势是力量与趋势。测"势"字，主顺势而为，借势而上。',en:'"Shi" is force and trend. It signals riding the momentum upward.',tip:'顺势而为，借势而上',enTip:'Ride the momentum; rise with the trend'},
  '学':{elem:1,radical:'子',structure:'上下结构（龸+子）',zh:'学字含子，教子学。测"学"字，主学业有成，学有所获。',en:'"Xue" contains the child—learning. It signals academic success.',tip:'学业有成，学有所获',enTip:'Academic success; real gains'},
  '业':{elem:1,radical:'一',structure:'独体字',zh:'业是事业功业。测"业"字，主事业有成，步步高升。',en:'"Ye" is career and achievement. It signals rising success.',tip:'事业有成，步步高升',enTip:'Career success; rising step by step'},
  '升':{elem:1,radical:'丿',structure:'独体字',zh:'升是上升高升。测"升"字，主运势上扬，步步高升。',en:'"Sheng" means rising. It signals an upward trend.',tip:'运势上扬，步步高升',enTip:'Rising fortune; step by step up'},
  '寿':{elem:4,radical:'寸',structure:'半包围结构（士+工+口+寸）',zh:'寿是长寿安康。测"寿"字，主健康长寿，福寿绵长。',en:'"Shou" is longevity. It signals health and long life.',tip:'健康长寿，福寿绵长',enTip:'Long life; enduring blessings'},
  '禄':{elem:4,radical:'礻',structure:'左右结构（礻+录）',zh:'禄是俸禄福气。测"禄"字，主官禄财运，禄位高升。',en:'"Lu" is salary and blessing. It signals rising wealth and rank.',tip:'官禄财运，禄位高升',enTip:'Rising rank and wealth'},
  '权':{elem:1,radical:'木',structure:'左右结构（木+又）',zh:'木旁是权，权是力量。测"权"字，主掌握主动，有权有责。',en:'"Quan" is power and authority. It signals taking the initiative.',tip:'掌握主动，有权有责',enTip:'Take initiative; power with duty'},
  '合':{elem:4,radical:'口',structure:'上下结构（人+一+口）',zh:'人一口，合也。测"合"字，主合作共赢，天作之合。',en:'One person, one mouth—unity. "He" signals win-win cooperation.',tip:'合作共赢，天作之合',enTip:'Win-win; a match made in heaven'},
  '吉':{elem:4,radical:'口',structure:'上下结构（士+口）',zh:'士人之口，吉言。测"吉"字，主大吉大利，诸事顺遂。',en:'"Ji" is auspiciousness. It signals great fortune and smooth sailing.',tip:'大吉大利，诸事顺遂',enTip:'Great fortune; all goes well'},
  '祥':{elem:4,radical:'礻',structure:'左右结构（礻+羊）',zh:'示旁是祭祀，羊是祥和。测"祥"字，主吉祥如意，祥瑞临门。',en:'Altar and sheep—auspicious. "Xiang" signals blessings arriving.',tip:'吉祥如意，祥瑞临门',enTip:'Blessings arrive; all is auspicious'},
  '兴':{elem:3,radical:'八',structure:'上下结构（八+一+八）',zh:'兴是兴旺兴盛。测"兴"字，主事业兴旺，家业昌盛。',en:'"Xing" means thriving. It signals flourishing career and family.',tip:'事业兴旺，家业昌盛',enTip:'Flourishing career and family'},
  '旺':{elem:3,radical:'日',structure:'左右结构（日+王）',zh:'日旺为王。测"旺"字，主运势旺盛，红红火火。',en:'Sun and king—thriving. "Wang" signals peak fortune.',tip:'运势旺盛，红红火火',enTip:'Peak fortune; blazing success'},
  '丰':{elem:1,radical:'丨',structure:'独体字',zh:'丰是丰收丰盛。测"丰"字，主收获丰厚，硕果累累。',en:'"Feng" is abundance. It signals a rich harvest.',tip:'收获丰厚，硕果累累',enTip:'Rich harvest; abundant fruit'},
  '盛':{elem:0,radical:'皿',structure:'上下结构（成+皿）',zh:'盛是盛大昌盛。测"盛"字，主事业鼎盛，如日中天。',en:'"Sheng" is flourishing. It signals your career at its peak.',tip:'事业鼎盛，如日中天',enTip:'Career at its peak; blazing sun'},
  '发':{elem:2,radical:'又',structure:'半包围结构',zh:'发是发展发达。测"发"字，主厚积薄发，一鸣惊人。',en:'"Fa" is development. It signals a burst after long accumulation.',tip:'厚积薄发，一鸣惊人',enTip:'Burst after accumulation; amaze all'},
  '进':{elem:2,radical:'辶',structure:'半包围结构（井+辶）',zh:'进是前进进取。测"进"字，主积极进取，更进一步。',en:'"Jin" is advancing. It signals positive progress.',tip:'积极进取，更进一步',enTip:'Advance positively; go further'},
  '退':{elem:2,radical:'辶',structure:'半包围结构（艮+辶）',zh:'退是退让后退。测"退"字，主以退为进，退一步海阔天空。',en:'"Tui" is retreat. It signals that stepping back opens space.',tip:'以退为进，退一步海阔天空',enTip:'Retreat to advance; step back for space'},
  '稳':{elem:1,radical:'禾',structure:'左右结构（禾+急）',zh:'禾是庄稼，稳是安稳。测"稳"字，主稳扎稳打，稳妥为上。',en:'Grain and steadiness. "Wen" signals solid, steady progress.',tip:'稳扎稳打，稳妥为上',enTip:'Solid and steady; stability first'},
  '快':{elem:2,radical:'忄',structure:'左右结构（忄+夬）',zh:'快是快速快乐。测"快"字，主行动迅速，快乐相伴。',en:'"Kuai" is speed and joy. It signals quick action with happiness.',tip:'行动迅速，快乐相伴',enTip:'Act quickly; joy accompanies'},
  '慢':{elem:2,radical:'忄',structure:'左右结构（忄+曼）',zh:'慢是缓慢从容。测"慢"字，主慢工出细活，从容不迫。',en:'"Man" is slowness and ease. It signals patience yields fine work.',tip:'慢工出细活，从容不迫',enTip:'Patience yields fine work; stay composed'},
  '止':{elem:4,radical:'止',structure:'独体字',zh:'止是停止知止。测"止"字，主知止不殆，适可而止。',en:'"Zhi" is stopping. It signals knowing when to stop.',tip:'知止不殆，适可而止',enTip:'Know when to stop; avoid danger'},
  '得':{elem:1,radical:'彳',structure:'左右结构（彳+旦+寸）',zh:'得是获得得到。测"得"字，主得偿所愿，有所收获。',en:'"De" is obtaining. It signals wishes fulfilled.',tip:'得偿所愿，有所收获',enTip:'Wishes fulfilled; real gains'},
  '失':{elem:0,radical:'丿',structure:'独体字',zh:'失是失去失意。测"失"字，主有失有得，塞翁失马。',en:'"Shi" is loss. It signals loss may hide gain.',tip:'有失有得，塞翁失马',enTip:'Loss hides gain; a blessing in disguise'},
  '舍':{elem:2,radical:'人',structure:'上下结构（人+舌）',zh:'舍是舍弃舍得。测"舍"字，主有舍才有得。',en:'"She" is letting go. It signals that giving up brings gain.',tip:'有舍才有得',enTip:'Let go to gain'},
  '圆':{elem:0,radical:'囗',structure:'全包围结构（囗+员）',zh:'圆是圆满团圆。测"圆"字，主圆满成功，阖家团圆。',en:'"Yuan" is completeness. It signals fulfillment and reunion.',tip:'圆满成功，阖家团圆',enTip:'Fulfillment; family reunion'},
  '满':{elem:2,radical:'氵',structure:'左右结构（氵+㒼）',zh:'水旁是满，满则溢。测"满"字，主圆满但戒骄，满招损。',en:'Water full overflows. "Man" signals fulfillment—but guard against pride.',tip:'圆满戒骄，满招损',enTip:'Fulfillment—guard against pride'},
  '谦':{elem:0,radical:'讠',structure:'左右结构（讠+兼）',zh:'言兼则谦。测"谦"字，主谦虚受益，谦谦君子。',en:'"Qian" is humility. It signals that modesty benefits.',tip:'谦虚受益，谦谦君子',enTip:'Modesty benefits; be the humble noble'},
  '让':{elem:0,radical:'讠',structure:'左右结构（讠+上）',zh:'言上是让。测"让"字，主以让为先，退让得福。',en:'"Rang" is yielding. It signals that concession brings blessing.',tip:'以让为先，退让得福',enTip:'Yield first; concession brings blessing'},

  '心':{elem:3,radical:'心',structure:'独体字',zh:'心是人之本。测"心"字，主心地纯正，心想事成。',en:'The heart is the root of a person. "Xin" signals a pure heart and wishes fulfilled.',tip:'心地纯正，心想事成',enTip:'A pure heart; wishes fulfilled'},
  '天':{elem:3,radical:'大',structure:'独体字',zh:'天是广阔无垠。测"天"字，主天时地利，前途广阔。',en:'Heaven is boundless. "Tian" signals favorable timing and vast prospects.',tip:'天时地利，前途广阔',enTip:'Favorable timing; vast prospects'},
  '地':{elem:4,radical:'土',structure:'左右结构（土+也）',zh:'地是厚德载物。测"地"字，主根基稳固，脚踏实地。',en:'Earth carries all with virtue. "Di" signals solid footing.',tip:'根基稳固，脚踏实地',enTip:'Solid footing; stay grounded'},
  '人':{elem:4,radical:'人',structure:'独体字',zh:'人是天地之灵。测"人"字，主以人为本，广结善缘。',en:'Human is the spirit of heaven and earth. "Ren" signals good relationships.',tip:'以人为本，广结善缘',enTip:'People first; build good bonds'},
  '山':{elem:4,radical:'山',structure:'独体字',zh:'山是稳重崇高。测"山"字，主稳重如山，步步高升。',en:'A mountain is steady and lofty. "Shan" signals stability and rising.',tip:'稳重如山，步步高升',enTip:'Steady as a mountain; rising step by step'},
  '水':{elem:2,radical:'水',structure:'独体字',zh:'水是流动智慧。测"水"字，主灵活变通，财源似水。',en:'Water is flowing wisdom. "Shui" signals flexibility and flowing wealth.',tip:'灵活变通，财源似水',enTip:'Flexible; wealth flows like water'},
  '火':{elem:3,radical:'火',structure:'独体字',zh:'火是热情能量。测"火"字，主热情似火，事业兴旺。',en:'Fire is passion and energy. "Huo" signals blazing passion.',tip:'热情似火，事业兴旺',enTip:'Blazing passion; thriving career'},
  '日':{elem:3,radical:'日',structure:'独体字',zh:'日是光明希望。测"日"字，主如日中天，光明在前。',en:'The sun is light and hope. "Ri" signals brightness ahead.',tip:'如日中天，光明在前',enTip:'Bright ahead; peak of the sun'},
  '月':{elem:2,radical:'月',structure:'独体字',zh:'月是阴柔美好。测"月"字，主花好月圆，柔中带刚。',en:'The moon is gentle and lovely. "Yue" signals harmony and beauty.',tip:'花好月圆，柔中带刚',enTip:'Harmony; gentle strength'},
  '星':{elem:3,radical:'日',structure:'上下结构（日+生）',zh:'星是璀璨希望。测"星"字，主星光璀璨，前程似锦。',en:'A star is brilliance and hope. "Xing" signals a bright future.',tip:'星光璀璨，前程似锦',enTip:'Brilliant stars; bright future'},
  '云':{elem:2,radical:'二',structure:'独体字',zh:'云是变幻自由。测"云"字，主云开见日，好运将至。',en:'Clouds are change and freedom. "Yun" signals the clouds parting for good luck.',tip:'云开见日，好运将至',enTip:'Clouds part; good luck comes'},
  '风':{elem:1,radical:'风',structure:'半包围结构',zh:'风是流动变化。测"风"字，主乘风破浪，一帆风顺。',en:'Wind is flow and change. "Feng" signals smooth sailing.',tip:'乘风破浪，一帆风顺',enTip:'Ride the wind; smooth sailing'},
  '雨':{elem:2,radical:'雨',structure:'独体字',zh:'雨是滋润万物。测"雨"字，主雨露滋润，福泽绵长。',en:'Rain nourishes all. "Yu" signals blessings and nourishment.',tip:'雨露滋润，福泽绵长',enTip:'Nourished; blessings endure'},
  '雪':{elem:2,radical:'雨',structure:'上下结构（雨+彐）',zh:'雪是纯净高洁。测"雪"字，主冰清玉洁，纯净美好。',en:'Snow is pure and noble. "Xue" signals purity and beauty.',tip:'冰清玉洁，纯净美好',enTip:'Pure and noble; clean and beautiful'},
  '花':{elem:1,radical:'艹',structure:'上下结构（艹+化）',zh:'花是绽放美好。测"花"字，主花开富贵，美好绽放。',en:'A flower blooms with beauty. "Hua" signals prosperity blossoming.',tip:'花开富贵，美好绽放',enTip:'Flowers bloom; prosperity blossoms'},
  '春':{elem:1,radical:'日',structure:'上下结构（三+人+日）',zh:'春是万物复苏。测"春"字，主春暖花开，生机勃勃。',en:'Spring revives all. "Chun" signals renewal and vitality.',tip:'春暖花开，生机勃勃',enTip:'Spring revives; full of life'},
  '秋':{elem:0,radical:'禾',structure:'左右结构（禾+火）',zh:'秋是收获金黄。测"秋"字，主金秋收获，硕果累累。',en:'Autumn is golden harvest. "Qiu" signals rich rewards.',tip:'金秋收获，硕果累累',enTip:'Autumn harvest; rich rewards'},
  '明':{elem:3,radical:'日',structure:'左右结构（日+月）',zh:'日月为明。测"明"字，主光明磊落，明辨是非。',en:'Sun and moon make brightness. "Ming" signals clarity and integrity.',tip:'光明磊落，明辨是非',enTip:'Bright and clear; discern right'},
  '光':{elem:3,radical:'儿',structure:'上下结构（⺌+兀）',zh:'光是希望照耀。测"光"字，主前途光明，光芒万丈。',en:'Light is hope shining. "Guang" signals a bright path.',tip:'前途光明，光芒万丈',enTip:'Bright path; radiant future'},
  '大':{elem:4,radical:'大',structure:'独体字',zh:'大是宽广宏大。测"大"字，主大展宏图，大有可为。',en:'Big is broad and grand. "Da" signals great ambition.',tip:'大展宏图，大有可为',enTip:'Great ambition; vast potential'},
  '小':{elem:1,radical:'小',structure:'独体字',zh:'小是谦逊精微。测"小"字，主积小成大，小事做起。',en:'Small is humble and subtle. "Xiao" signals that small steps build big.',tip:'积小成大，小事做起',enTip:'Small steps build big'},

let curChar='';

// 每日一字（按日期固定）
let dailyChar='';
function renderDaily(){
  const el=document.getElementById('dailyCard');
  if(!el)return;
  const today=new Date().toDateString();
  let seed=0;for(let i=0;i<today.length;i++)seed+=today.charCodeAt(i);
  dailyChar=RANDOM_CHARS[seed%RANDOM_CHARS.length];
  const l=lang;
  el.innerHTML=`<div style="font-size:11px;color:var(--dim);letter-spacing:1px;margin-bottom:4px">📆 ${l==='zh'?'今日吉字（点击使用）':'Today\'s character (tap to use)'}</div><div style="font-size:22px;color:var(--gold)">「${dailyChar}」</div>`;
}
function useDailyChar(){
  document.getElementById('charInput').value=dailyChar;
  showT(lang==='zh'?'已选今日吉字：'+dailyChar:'Selected: '+dailyChar);
}

// 收藏
function toggleFavChar(){
  const c=curChar;
  if(!c){return;}
  const i=favChars.indexOf(c);
  if(i>=0){favChars.splice(i,1);showT(lang==='zh'?'已取消收藏':'Removed');}
  else{favChars.push(c);showT(lang==='zh'?'已收藏 ★':'Favorited ★');}
  saveFav();
  updateFavBtn();
}
function updateFavBtn(){
  const b=document.getElementById('btnToggleFav');
  if(b){
    const isFav=favChars.indexOf(curChar)>=0;
    b.textContent=isFav?(lang==='zh'?'★ 已收藏':'★ Saved'):(lang==='zh'?'☆ 收藏':'☆ Save');
  }
  const fc=document.getElementById('favCount');
  if(fc)fc.textContent=favChars.length;
}
function showFavList(){
  const div=document.getElementById('favHistList');
  if(favChars.length===0){showT(lang==='zh'?'收藏夹是空的':'No favorites');return;}
  div.innerHTML=`<div style="font-size:12px;color:var(--gold);margin-bottom:6px">⭐ ${lang==='zh'?'收藏夹':'Favorites'}</div>`+favChars.map(c=>`<span class="cat-chip" style="cursor:pointer" onclick="document.getElementById('charInput').value='${c}';showT('${c}')">${c}</span>`).join('')+`<button class="btn muted sm" style="margin-top:8px" onclick="clearFav()">${lang==='zh'?'清空收藏':'Clear'}</button>`;

function clearFav(){favChars=[];saveFav();showT(lang==='zh'?'已清空':'Cleared');showFavList();updateFavBtn();}

  histChars=histChars.filter(x=>x!==c);

  const c=RANDOM_CHARS[Math.floor(Math.random()*RANDOM_CHARS.length)];

function doDivine(){
  const ch=(document.getElementById('charInput').value||'').trim();
  if(!ch){showT(lang==='zh'?'请输入一个字':'Please enter a character');return;}
  const c=ch[0];
  // 判断是否汉字
  if(!/[\u4e00-\u9fa5]/.test(c)){showT(lang==='zh'?'请输入汉字':'Please enter a Chinese character');return;}
  const q=(document.getElementById('question').value||'').trim();
  const by=document.getElementById('by').value.trim();
  const bm=document.getElementById('bm').value.trim();
  const bd=document.getElementById('bd').value.trim();
  const bh=document.getElementById('bh').value;
  // 八字合参校验：除非四项全空，否则必须填全
  const anyFilled=by!==''||bm!==''||bd!==''||bh!=='';
  if(anyFilled){
    const missing=[];
    if(by==='')missing.push(lang==='zh'?'年份':'year');
    if(bm==='')missing.push(lang==='zh'?'月份':'month');
    if(bd==='')missing.push(lang==='zh'?'日期':'day');
    if(bh==='')missing.push(lang==='zh'?'时辰':'hour');
    if(missing.length>0){
      showT((lang==='zh'?'八字合参请补全：':'BaZi synthesis missing: ')+missing.join('、'));
      return;
    }
  }
  const hasBazi=anyFilled;
  // 查测字库
  let info=CEZI[c];
  if(!info){info=autoAnalyze(c);}
  let elemIdx=info.elem;
  curChar=c;
  addHistory(c);
  updateFavBtn();
  document.getElementById('bigChar').textContent=c;
  renderResult(c, info, elemIdx, q, hasBazi, {by:parseInt(by),bm:parseInt(bm),bd:parseInt(bd),bh:bh});
  document.getElementById('inputPage').style.display='none';
  document.getElementById('resultPage').style.display='block';
}

function detectElem(c){
  // 通过部首检测五行
  for(const r in RADICAL_ELEM){
    if(c.includes(r))return RADICAL_ELEM[r];
  }
  // 默认土（中）
  return 4;
}

// ========== 通用拆字解读（未收录字也适用，多角度+方案） ==========
function autoAnalyze(c){
  // 判断字形结构
  let structure='独体字';
  const L=c.length;
  // 左右结构检测：常见偏旁
  const leftRads=['亻','氵','讠','木','扌','钅','女','忄','纟','土','口','日','月','火','贝','石','禾','王','礻','衤','虫','足','马','鸟','饣','车','辶','酉','阝','目','矢','米','子','彳','山','彡','羊','门','忄','艹','钅','纟','讠','氵'];
  for(const r of leftRads){
    if(c.startsWith(r)&&c.length>1){structure='左右结构（'+r+' + '+(c.slice(1))+'）';break;}
  }
  // 上下结构检测
  if(structure==='独体字'&&c.length>=2){
    const topRads=['艹','宀','亠','冖','八','人','日','竹','雨','⺮','凵','山','口','士','彐','夕','父','禾','穴','大','小','心','灬','木','水','艹','亠','冖'];
    for(const r of topRads){
      if(c.startsWith(r)){structure='上下结构（'+r+' + '+(c.slice(1))+'）';break;}
    }
    // 下部件检测（如 灬 四点底）
    if(structure==='独体字'){
      const bottomRads=['灬','心','土','皿','口','日','目','木','水','火'];
      for(const r of bottomRads){
        if(c.endsWith(r)){structure='上下结构（'+(c.slice(0,-1))+' + '+r+'）';break;}
      }
    }
  }
  // 半包围检测
  if(structure==='独体字'&&c.length>=2){
    const wrapRads=['广','厂','尸','疒','辶','廴','勹','匚','门','囗','几'];
    for(const r of wrapRads){
      if(c.startsWith(r)||c.includes(r)){structure='半包围结构';break;}
    }
  }
  const elem=detectElem(c);
  const elemName=ELEM_NAMES[elem];
  const elemDesc=ELEM[elemName].desc;
  // 笔画数（用于解读）
  const strokes=strokeCount(c);
  // 五行能量解读
  const elemInsight={
    0:'金主刚毅果断。此字携金气，提示你此刻宜坚定立场、当断则断，以原则立身。',
    1:'木主生长生机。此字携木气，提示你此刻宜耐心培育、向上生长，蓄势待发。',
    2:'水主智慧变通。此字携水气，提示你此刻宜灵活应变、以柔克刚，遇阻则绕。',
    3:'火主热情行动。此字携火气，提示你此刻宜积极行动、燃起热情，但勿操之过急。',
    4:'土主稳重承载。此字携土气，提示你此刻宜脚踏实地、稳扎稳打，厚积薄发。'
  };
  const elemInsightEn={
    0:'Metal rules firmness. This character carries metal energy—stand firm, decide decisively, hold your principles.',
    1:'Wood rules growth. This character carries wood energy—nurture patiently, grow upward, gather strength.',
    2:'Water rules wisdom. This character carries water energy—be flexible, overcome hardness with softness, flow around obstacles.',
    3:'Fire rules action. This character carries fire energy—act positively, ignite passion, but do not rush.',
    4:'Earth rules stability. This character carries earth energy—stay grounded, steady and solid, accumulate slowly.'
  };
  // 结构解读
  const structInsight={
    '左右结构':l=>l==='zh'?'此字左右相扶，如人结伴而行，提示你遇事可寻助力、多与人协作。':'Its left-right structure is like companions walking together—seek help and collaborate.',
    '上下结构':l=>l==='zh'?'此字上下相承，如根基托举，提示你先把基础打牢，自下而上稳步推进。':'Its top-bottom structure is like a base supporting the top—build a solid foundation and advance upward.',
    '半包围结构':l=>l==='zh'?'此字半围半开，如门户虚掩，提示你进退有度、留有余地，不必把话说满。':'Its half-enclosed form is like a door ajar—leave room, do not close every option.',
    '独体字':l=>l==='zh'?'此字独立成体，一气呵成，提示你独立自主、干脆利落，少受牵绊。':'Its single-body form flows in one stroke—be independent and decisive, free of entanglements.'

// 笔画数估算（简化：按 Unicode 码点与常见部首近似，仅供趣味参考）
function strokeCount(c){
  // 简化处理：返回字符长度作为基础，这里用 hash 近似
  let n=0;
  for(let i=0;i<c.length;i++){n+=c.charCodeAt(i);}
  return (n%20)+1; // 1-20 之间近似笔画数
}

// ========== 八字日主（简化） ==========
function calcBazi(b){
  // 用 lunar 库计算日主，若无则返回 null
  try{
    if(typeof Solar==='undefined')return null;
    const solar=Solar.fromYmdHms(b.by,b.bm,b.bd,Number(b.bh)*2,0,0);
    const lunar=solar.getLunar();
    const dayGZ=lunar.getDayInGanZhi(); // 日柱
    const dayStem=dayGZ[0];
    const STEMS='甲乙丙丁戊己庚辛壬癸';
    const ELEMS=['木','木','火','火','土','土','金','金','水','水'];
    const idx=STEMS.indexOf(dayStem);
    return {dayStem:dayStem, dayElem:ELEMS[idx], dayElemIdx:ELEM_NAMES.indexOf(ELEMS[idx])};
  }catch(e){return null;}
}

function wrapText(c,text,x,y,maxW,lineH){
  const chars=String(text).split('');
  let line='',yy=y;
  for(let i=0;i<chars.length;i++){
    line+=chars[i];
    if(c.measureText(line).width>maxW){
      c.fillText(line.slice(0,-1),x,yy);
      line=chars[i];yy+=lineH;
    }
  }
  if(line)c.fillText(line,x,yy);
  return yy+lineH;
}
